name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Upload to Capgo (Live Updates)
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        if: ${{ env.CAPGO_TOKEN != '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm version "${VERSION}-${{ github.run_number }}" --no-git-tag-version
          npx @capgo/cli@latest app add com.mukdev.thermalprint -a ${{ secrets.CAPGO_TOKEN }} || true
          npx @capgo/cli@latest bundle upload -a ${{ secrets.CAPGO_TOKEN }} -c production --path www --no-code-check

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrintResiTermal-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
